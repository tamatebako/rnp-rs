name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the SAME PR / branch. Note: the group key
# intentionally does NOT include github.event_name, so a push to a
# branch that has an open PR will cancel the in-flight pull_request
# run (and vice versa) — they share the group key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: -D warnings
  # Homebrew added tap-trust requirements that block `brew install` on
  # runners without explicit trust. Disable the check; we install only
  # well-known packages anyway.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  # ---------------------------------------------------------------------
  # Spell check (fast, runs first to fail-fast on typos).
  # ---------------------------------------------------------------------
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  # ---------------------------------------------------------------------
  # Lint + test with vendored build (rnp-src compiles librnp from source).
  # The "default" name is kept for CI history continuity; all cargo
  # commands now use --features vendored so we have ONE build path —
  # rnp-src (with botan-src) owns all version pinning.
  # ---------------------------------------------------------------------
  system:
    name: default (${{ matrix.os }})
    needs: typos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3 curl

      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake python3

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: system-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rnp-src/build.rs') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --features vendored -- -D warnings

      - name: cargo test
        run: cargo test --features vendored --no-fail-fast

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features vendored

  # ---------------------------------------------------------------------
  # MSRV check: ensure the crate compiles on the declared minimum
  # supported Rust version (currently 1.88, matching let-chains in build.rs).
  # ---------------------------------------------------------------------
  msrv:
    name: MSRV (1.88)
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3 curl

      - name: cargo build (MSRV)
        run: cargo build --all-targets --features vendored

      - name: cargo test (MSRV)
        run: cargo test --features vendored --no-fail-fast

  # ---------------------------------------------------------------------
  # Vendored build — rnp-src crate compiles librnp + Botan + json-c +
  # zlib + bzip2 from source. No system librnp or Botan needed.
  # ---------------------------------------------------------------------
  vendored:
    name: vendored (${{ matrix.os }})
    needs: typos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # rnp-src builds json-c, zlib, bzip2 from source too, but we
      # still need cmake + a C/C++ toolchain. Botan is built from source
      # by botan-src transitively, so we do NOT install libbotan-* here.
      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install json-c zlib bzip2 cmake

      - name: Install build deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev cmake \
            build-essential python3 curl

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: vendored-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rnp-src/build.rs') }}

      - name: cargo test --features vendored
        run: cargo test --features vendored --no-fail-fast

  # ---------------------------------------------------------------------
  # PQC build — build Botan 3.6 + librnp HEAD with ENABLE_PQC=ON.
  # ---------------------------------------------------------------------
  pqc:
    name: pqc + crypto-refresh
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # rnp-src + botan-src-compat (3.7.1) build Botan + librnp from
      # source when pqc + crypto-refresh are on. Older Botan is needed
      # because librnp 0.18.1 references EC_Group / EC_Point by value,
      # which Botan 3.11+ made opaque (PIMPL).
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3 curl

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pqc-vendored-${{ hashFiles('Cargo.lock', 'rnp-src/build.rs') }}

      - name: cargo test --features vendored,pqc,crypto-refresh
        run: cargo test --features vendored,pqc,crypto-refresh --no-fail-fast

  # ---------------------------------------------------------------------
  # cargo-deny: license and security advisory checks.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------
  # cargo-semver-checks: catch breaking API changes against the
  # previous tag (gated on a tag existing; skipped on first release).
  # ---------------------------------------------------------------------
  semver:
    name: cargo-semver-checks
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3 curl

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: cargo semver-checks
        run: cargo semver-checks check-release 2>&1 || true

  # ---------------------------------------------------------------------
  # Windows build — uses MSYS2 UCRT64 toolchain (same approach as
  # librnp's own CI). rnp-src builds librnp + Botan + json-c + zlib +
  # bzip2 from source via gcc inside MSYS2; this avoids the missing
  # `getopt.h` issue that breaks MSVC builds of librnp 0.18.1.
  # ---------------------------------------------------------------------
  windows:
    name: windows (MSYS2 UCRT64 + vendored)
    needs: typos
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 45
    env:
      # Override cargo's jobserver semaphore — MSYS2's make can't parse
      # the `__rust_jobserver_semaphore_*` string cargo passes, so it
      # falls back to -j1 and Botan takes 30+ min single-threaded.
      # Setting CARGO_MAKEFLAGS to a plain -j4 means botan-src's make()
      # passes MAKEFLAGS=-j4 which MSYS2's make understands.
      CARGO_MAKEFLAGS: "-j4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Inherit Windows PATH so cargo/rustc (installed by
          # dtolnay/rust-toolchain above) are visible inside the MSYS2
          # shell. Without this, MSYS2 starts with a minimal PATH and
          # `cargo: command not found`.
          path-type: inherit
          install: >-
            base-devel
            tar
            curl
            patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: vendored-windows-gnu-${{ hashFiles('Cargo.lock', 'rnp-src/build.rs') }}

      # Run inside the MSYS2 shell so PATH, CC, CXX all resolve to the
      # mingw gcc. rnp-src/build.rs's `gcc`/`g++`/`ar`/`make`/`nproc`
      # calls find MSYS2 binaries on PATH.
      - name: cargo test --features vendored (MSYS2 UCRT64)
        shell: msys2 {0}
        run: cargo test --features vendored --target x86_64-pc-windows-gnu --no-fail-fast

  # ---------------------------------------------------------------------
  # Miri — run the unsafe-code paths (ffi_safe, callbacks, Drop impls)
  # under Miri to catch undefined behavior. Currently focused on the
  # FFI seam module; full test suite would require a stub C library.
  # ---------------------------------------------------------------------
  miri:
    name: miri (ffi_safe)
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: nightly
          components: miri
          command: miri test
          extra-args: --lib
          env-vars: |
            MIRIFLAGS=-Zmiri-permissive-provenance
          allow-failure: "true"

  # ---------------------------------------------------------------------
  # Performance regression — compare benches/ against the committed
  # baseline. allow-failure until baseline is verified stable across
  # runner generations.
  # ---------------------------------------------------------------------
  bench:
    name: bench (regression check)
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: stable
          pre-setup: cargo install critcmp --locked || true
          command: bench
          extra-args: --no-run
          post-commands: cargo bench --bench sign_verify -- --quick || true
          allow-failure: "true"

  # ---------------------------------------------------------------------
  # Rust beta — catches upcoming stable regressions early.
  # ---------------------------------------------------------------------
  beta:
    name: beta toolchain
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: beta
          command: test
          extra-args: --all-targets
          allow-failure: "true"

  # ---------------------------------------------------------------------
  # Rust nightly — catches nightly breakage. allow-failure since nightly
  # is volatile.
  # ---------------------------------------------------------------------
  nightly:
    name: nightly toolchain
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: nightly
          command: test
          extra-args: --all-targets
          allow-failure: "true"
